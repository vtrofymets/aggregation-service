app:
  data-sources:
    - name: db1
      strategy: postgres
      url: jdbc:tc:postgresql:16:///${app.data-sources[0].name}
      user: test
      password: test
      table: users
      mapping:
        id: user_id
        username: login
        name: first_name
        surname: last_name
      migration:
        enabled: true
      health:
        test-query: 'SELECT 1'
    - name: db2
      strategy: postgres
      url: jdbc:tc:postgresql:16:///${app.data-sources[1].name}
      user: test
      password: test
      table: user_table
      mapping:
        id: id
        username: login
        name: name
        surname: surname
      migration:
        enabled: true
      health:
        test-query: 'SELECT 1'


# Definition
context:
  connections:
    - name: db1
      strategy: POSTGRES
      url: jdbc:tc:postgresql:16:///db1
      username: postgres
      password: postgres
      health:
        test-query: 'SELECT 1'
      properties:
        name: name
        name2: name2
      migration:
        enabled: true
    - name: db2
      strategy: POSTGRES
      url: jdbc:tc:postgresql:16:///db2
      username: postgres
      password: postgres
      migration:
        enabled: true
  domains:
    users:
      #        response-dto: org.vt.aggregation.api.dto.UserResponseDto
      - connection-name: db1
        entity: users
        mapping:
          id: user_id
          username: login
          name: first_name
          surname: last_name
        mapping2:
          id: user_id
          person:
            id: id
        migration:
          enabled: true
          location:
      - connection-name: db2
        entity: user_table
        mapping:
          id: id
          username: login
          name: name
          surname: surname
    goods:
      - connection-name: db1
        entity: goods
        mapping:
          id: id
          name: name
          price: price
          quantity: quantity
          description: description
